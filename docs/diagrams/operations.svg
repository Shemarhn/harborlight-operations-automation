<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="780" viewBox="0 0 1120 780" role="img" aria-labelledby="title desc">
<title id="title">Harborlight operations automation: executed Ubuntu runner architecture</title>
<desc id="desc">Browser-authored GitHub source runs on a disposable standard Ubuntu runner. A read-only app, audit controller, local backup and isolated restore are connected inside that boundary. A timer invokes audit only; explicit apply permits a guarded service restart. There is no external notification or off-device backup.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#086d70"/></marker></defs>
