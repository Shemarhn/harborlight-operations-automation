<text x="443" y="327" font-size="18" font-weight="700" fill="#fff">Operations controller</text>
<text x="443" y="355" font-size="16" fill="#d0ece8">Six checks • fixed owned root</text>
<text x="443" y="381" font-size="16" fill="#d0ece8">Preview → explicit guarded apply</text>
<text x="443" y="405" font-size="14" fill="#d0ece8">Lock + cooldown + post-check</text>
