<text x="798" y="327" font-size="18" font-weight="700">Audit-only timer</text>
<text x="798" y="355" font-size="16">Real systemd automatic runs</text>
<text x="798" y="381" font-size="16">5-second lab interval</text>
<text x="798" y="405" font-size="14">No scheduled remediation</text>
