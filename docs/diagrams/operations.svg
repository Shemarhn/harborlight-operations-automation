<g font-family="Segoe UI,Arial,sans-serif" fill="#102e38">
<text x="42" y="48" font-size="27" font-weight="700">Harborlight • operations with verified recovery</text>
<text x="42" y="78" font-size="16">Executed synthetic lab • standard Ubuntu 24.04 runner • no paid resources</text>
<rect x="42" y="105" width="1036" height="84" rx="10" fill="#102e38"/>
<text x="65" y="139" font-size="19" fill="#fff" font-weight="700">GitHub public repository + read-only Actions workflow</text>
<text x="65" y="167" font-size="16" fill="#d0ece8">Browser-authored source → tests → owned fault exercise → sanitized summary and logs</text>
<path d="M560 189V224" stroke="#086d70" stroke-width="3" marker-end="url(#arrow)"/>
